plugins {
    id 'com.android.application'
}

android {
    namespace 'ph.alcala.rainfedtagging'
    compileSdk 34

    defaultConfig {
        applicationId "ph.alcala.rainfedtagging"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
