name: Build Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          ls "$ANDROID_HOME/platforms" || true

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk rainfed-tagging-alcala-offline.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rainfed-tagging-alcala-apk
          path: rainfed-tagging-alcala-offline.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Offline edition — no server, all data stored on the phone.
          Install: allow 'install unknown apps', grant Camera + Location permissions.
          Admin / Datos tab PIN: 1234. Export CSV / GeoJSON / Photos ZIP from the Admin tab."
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest rainfed-tagging-alcala-offline.apk --clobber
            gh release edit apk-latest --notes "$NOTES"
          else
            gh release create apk-latest rainfed-tagging-alcala-offline.apk \
              --title "RAINfed-Tagging Alcala — Offline APK (latest)" \
              --notes "$NOTES" \
              --target "${{ github.sha }}"
          fi
